        function setElementPosition(el, x, y) {
            el.style.left = x + "px";
            el.style.top = y + "px";
            el.style.right = "auto";
            el.style.bottom = "auto";
        }

        function centerWindow() {
            const w = floatingWindow.offsetWidth;
            const h = floatingWindow.offsetHeight;
            const x = Math.max((window.innerWidth - w) / 2, 12);
            const y = Math.max((window.innerHeight - h) / 2, 12);
            setElementPosition(floatingWindow, x, y);
        }

        function clampToViewport(el) {
            const rect = el.getBoundingClientRect();
            let x = rect.left;
            let y = rect.top;
            const maxX = window.innerWidth - rect.width - 8;
            const maxY = window.innerHeight - rect.height - 8;
            x = Math.min(Math.max(8, x), Math.max(8, maxX));
            y = Math.min(Math.max(8, y), Math.max(8, maxY));
            setElementPosition(el, x, y);
        }

        function snapToEdges(el) {
            const rect = el.getBoundingClientRect();
            let x = rect.left;
            let y = rect.top;
            const margin = 10;
            const snap = 38;
            const rightEdge = window.innerWidth - rect.right;
            const bottomEdge = window.innerHeight - rect.bottom;
            if (x < snap) x = margin;
            if (y < snap) y = margin;
            if (rightEdge < snap) x = window.innerWidth - rect.width - margin;
            if (bottomEdge < snap) y = window.innerHeight - rect.height - margin;
            setElementPosition(el, x, y);
            clampToViewport(el);
        }

        /* ============================================================
               DRAGGABLE
               ============================================================ */
        function makeDraggable(target, handle, ignoreSelector) {
            let dragging = false;
            let offsetX = 0,
                offsetY = 0;
            const h = handle || target;

            h.addEventListener("pointerdown", function(e) {
                if (ignoreSelector && e.target.closest(ignoreSelector)) return;
                dragging = true;
                const rect = target.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                target.setPointerCapture && target.setPointerCapture(e.pointerId);
                e.preventDefault();
            });

            window.addEventListener("pointermove", function(e) {
                if (!dragging) return;
                setElementPosition(target, e.clientX - offsetX, e.clientY - offsetY);
                clampToViewport(target);
            });

            window.addEventListener("pointerup", function() {
                if (!dragging) return;
                dragging = false;
                snapToEdges(target);
            });

            window.addEventListener("pointercancel", function() {
                if (!dragging) return;
                dragging = false;
                snapToEdges(target);
            });
        }

        /* ============================================================
               PANEL CONTROL
               ============================================================ */
        function minimizePanel() {
            panelState = "minimized";
            const rect = floatingWindow.getBoundingClientRect();
            floatingWindow.classList.add("window-hidden");
            openLauncher.classList.remove("show");
            miniLauncher.classList.add("show");
            const x = Math.min(rect.left + rect.width - 64, window.innerWidth - 74);
            const y = Math.min(rect.top + 6, window.innerHeight - 74);
            setElementPosition(miniLauncher, Math.max(10, x), Math.max(10, y));
            snapToEdges(miniLauncher);
        }

        function closePanel() {
            panelState = "closed";
            const rect = floatingWindow.getBoundingClientRect();
            floatingWindow.classList.add("window-hidden");
            miniLauncher.classList.remove("show");
            openLauncher.classList.add("show");
            const x = Math.min(rect.left + rect.width - 150, window.innerWidth - 170);
            const y = Math.min(rect.top + 8, window.innerHeight - 56);
            setElementPosition(openLauncher, Math.max(10, x), Math.max(10, y));
            snapToEdges(openLauncher);
        }

        function openPanelFromMini() {
            panelState = "open";
            floatingWindow.classList.remove("window-hidden");
            miniLauncher.classList.remove("show");
            openLauncher.classList.remove("show");
            const rect = miniLauncher.getBoundingClientRect();
            const x = Math.min(Math.max(rect.left - 140, 10), window.innerWidth - floatingWindow.offsetWidth - 10);
            const y = Math.min(Math.max(rect.top - 20, 10), window.innerHeight - floatingWindow.offsetHeight - 10);
            setElementPosition(floatingWindow, x, y);
            clampToViewport(floatingWindow);
        }

        function openPanelFromClosed() {
            panelState = "open";
            floatingWindow.classList.remove("window-hidden");
            miniLauncher.classList.remove("show");
            openLauncher.classList.remove("show");
            const rect = openLauncher.getBoundingClientRect();
            const x = Math.min(Math.max(rect.left - 120, 10), window.innerWidth - floatingWindow.offsetWidth - 10);
            const y = Math.min(Math.max(rect.top - 14, 10), window.innerHeight - floatingWindow.offsetHeight - 10);
            setElementPosition(floatingWindow, x, y);
            clampToViewport(floatingWindow);
        }

        minBtn.addEventListener("click", minimizePanel);
        closeBtn.addEventListener("click", closePanel);
        miniLauncher.addEventListener("click", openPanelFromMini);
        openLauncher.addEventListener("click", openPanelFromClosed);

        /* ============================================================
               UI HELPERS
               ============================================================ */
        function showMsg(type, text) {
            const icons = {
                success: "M12 2a10 10 0 1 0 10 10A10.01 10.01 0 0 0 12 2zm-1 14-4-4 1.41-1.41L11 13.17l5.59-5.59L18 9z",
                error: "M12 2a10 10 0 1 0 10 10A10.01 10.01 0 0 0 12 2zm1 15h-2v-2h2zm0-4h-2V7h2z",
                warn: "M1 21h22L12 2 1 21zm12-3h-2v-2h2zm0-4h-2v-4h2z"
            };
            msgBox.className = "msg-box show " + type;
            msgText.textContent = text;
            msgIcon.innerHTML = '<path d="' + icons[type] + '"></path>';
        }

        function hideMsg() {
            msgBox.className = "msg-box";
        }

        function setLoading(state) {
            loginInProgress = state;
            if (state) {
                loginBtn.classList.add("loading");
                loginBtn.disabled = true;
            } else {
                loginBtn.classList.remove("loading");
                loginBtn.disabled = false;
            }
        }

        /* ============================================================
               SERVER STATUS (Firebase real-time)
               ============================================================ */
        db.ref("admin/config").on("value", function(snap) {
            if (snap.exists()) {
                const config = snap.val();
                serverOnline = config.serverOnline !== false;
                maintenanceMode = config.maintenanceMode === true;

                if (!serverOnline) {
                    serverStatusBadge.className = "status-pill offline";
                    serverStatusText.textContent = "Offline";
                } else if (maintenanceMode) {
                    serverStatusBadge.className = "status-pill maintenance";
                    serverStatusText.textContent = "Maintenance";
                } else {
                    serverStatusBadge.className = "status-pill online";
                    serverStatusText.textContent = "Online";
                }
            } else {
                serverStatusBadge.className = "status-pill online";
                serverStatusText.textContent = "Online";
            }
        });

        /* ============================================================
               KEY VALIDATION PREVIEW (real-time — FIXED)
               ============================================================ */
        let validationTimer = null;

        keyInput.addEventListener("input", function() {
            hideMsg();
            validityInfo.classList.remove("show");
            const raw = this.value.trim().toUpperCase();
            if (raw.length < 5) return;

            clearTimeout(validationTimer);
            validationTimer = setTimeout(async function() {
                if (raw.length < 5) return;
                try {
                    let deviceSerial = "BRW_preview";
                    if (window.AndroidNative && typeof window.AndroidNative.getDeviceFingerprint === 'function') {
                        deviceSerial = window.AndroidNative.getDeviceFingerprint();
                    }
                    const params = new URLSearchParams();
                    params.append("user_key", raw);
                    params.append("games", "STARTER,PLUS,PRO,ELITE");
                    params.append("serial", deviceSerial);
                    params.append("verrr", "1.0.0");
                    params.append("c_rng", "0");

                    const res = await fetch("https://key.bnpanel.top/connect", {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: params.toString()
                    });
                    const resData = await res.json();
                    if (resData && resData.status === true) {
                        const exp = resData.data && resData.data.EXP ? resData.data.EXP : "Active";
                        validityText.innerHTML = 'Valid key <span>(' + exp + ')</span>';
                        validityInfo.classList.add("show");
                    }
                } catch(e) {}
            }, 600);
        });

        /* ============================================================
               LOGIN HANDLER — GATEWAY KEY SYSTEM
               ============================================================ */
        keyInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") handleLogin();
        });

        keyInput.addEventListener("focus", hideMsg);

        async function handleLogin() {
            if (loginInProgress) return;

            const key = keyInput.value.trim().toUpperCase();

            if (!key) {
                showMsg("error", "Please enter your access key.");
                keyInput.focus();
                return;
            }

            setLoading(true);
            hideMsg();
            validityInfo.classList.remove("show");

            try {
                // Get native hardware fingerprint if available, else local fallback
                let deviceSerial = "BRW_" + Math.random().toString(36).substring(2, 10);
                if (window.AndroidNative && typeof window.AndroidNative.getDeviceFingerprint === 'function') {
                    deviceSerial = window.AndroidNative.getDeviceFingerprint();
                } else if (localStorage.getItem("bn_device_serial")) {
                    deviceSerial = localStorage.getItem("bn_device_serial");
                } else {
                    localStorage.setItem("bn_device_serial", deviceSerial);
                }

                // Authenticate against key.bnpanel.top/connect
                const params = new URLSearchParams();
                params.append("user_key", key);
                params.append("games", "STARTER,PLUS,PRO,ELITE");
                params.append("serial", deviceSerial);
                params.append("verrr", "1.0.0");
                params.append("c_rng", "0");

                const response = await fetch("https://key.bnpanel.top/connect", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: params.toString()
                });

                const resData = await response.json();

                if (!resData || resData.status !== true) {
                    setLoading(false);
                    const reason = resData?.reason || resData?.message || "Invalid or inactive key.";
                    showMsg("error", reason);
                    keyInput.focus();
                    keyInput.select();
                    return;
                }

                // Parse Plan
                let userPlan = "STARTER";
                const realStr = resData.data && resData.data.real ? String(resData.data.real) : "";
                if (realStr.startsWith("ELITE") || key.includes("ELITE") || key.includes("CALLMEGOD")) {
                    userPlan = "ELITE";
                } else if (realStr.startsWith("PRO") || key.includes("PRO")) {
                    userPlan = "PRO";
                } else if (realStr.startsWith("PLUS") || key.includes("PLUS")) {
                    userPlan = "PLUS";
                } else if (realStr.startsWith("STARTER")) {
                    userPlan = "STARTER";
                }

                // Display validity
                if (resData.data && resData.data.EXP) {
                    validityText.innerHTML = 'Expires <span>' + resData.data.EXP + '</span>';
                    validityInfo.classList.add("show");
                } else {
                    validityText.innerHTML = 'Validity <span>Active</span>';
                    validityInfo.classList.add("show");
                }

                // Construct session token expected by guard.js
                const sessionPayload = {
                    key: key,
                    plan: userPlan,
                    serial: deviceSerial,
                    ts: Date.now()
                };
                const sessionToken = btoa(JSON.stringify(sessionPayload));

                localStorage.setItem("bnkey", key);
                localStorage.setItem("bn_plan", userPlan);
                sessionStorage.setItem("bn_session_token", sessionToken);

                setLoading(false);
                showMsg("success", "Login successful (" + userPlan + " Plan). Redirecting...");

                // Determine redirect target URL
                const urlParams = new URLSearchParams(window.location.search);
                const targetGame = urlParams.get("game");

                let redirectUrl = (userPlan === "ELITE") ? "ehome.html" : "home.html";

                if (targetGame) {
                    const gameMap = {
                        "wingo_1m": "wingo_1m.html",
                        "wingo_30s": "wingo_30s.html",
                        "k3_1m": "k3_1m.html",
                        "trx_1m": "trx_1m.html",
                        "ewingo_1m": (userPlan === "ELITE") ? "ewingo_1m.html" : "wingo_1m.html",
                        "etrx_1m": (userPlan === "ELITE") ? "etrx_1m.html" : "trx_1m.html"
                    };
                    if (gameMap[targetGame]) {
                        redirectUrl = gameMap[targetGame];
                    }
                }

                setTimeout(function() {
                    window.location.href = redirectUrl;
                }, 1000);

            } catch (error) {
                setLoading(false);
                showMsg("error", "Connection error. Please check server.");
                console.error("[GOKU PANEL] Login error:", error);
            }
        }

        document.getElementById("loginBtn").addEventListener("click", handleLogin);

        /* ============================================================
               INIT
               ============================================================ */
        function init() {
            centerWindow();
            setElementPosition(miniLauncher, window.innerWidth - 78, window.innerHeight - 86);
            setElementPosition(openLauncher, window.innerWidth - 170, window.innerHeight - 60);

            makeDraggable(floatingWindow, windowHeader, ".win-btn");
            makeDraggable(miniLauncher);
            makeDraggable(openLauncher);

            const storedKey = localStorage.getItem("bnkey");
            if (storedKey) {
                keyInput.value = storedKey;
                keyInput.dispatchEvent(new Event("input"));
            }
        }

        window.addEventListener("resize", function() {
            clampToViewport(floatingWindow);
            if (miniLauncher.classList.contains("show")) clampToViewport(miniLauncher);
            if (openLauncher.classList.contains("show")) clampToViewport(openLauncher);
        });

        window.addEventListener("load", init);
    </script>
